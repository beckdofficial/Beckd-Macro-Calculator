
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beckd Macro Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffeef2;
      color: #333;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #d6336c;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .unit-group {
      display: none;
    }
    button {
      background-color: #d6336c;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    #results {
      margin-top: 20px;
      background: #fff0f5;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Beckd Macro Calculator</h1>

  <label for="age">Age ✨</label>
  <input type="number" id="age" />

  <label for="gender">Gender ♀️♂️</label>
  <select id="gender">
    <option value="female">Female</option>
    <option value="male">Male</option>
  </select>

  <label for="heightUnit">Height Unit 📏</label>
  <select id="heightUnit" onchange="toggleHeightUnit()">
    <option value="feet">Feet & Inches</option>
    <option value="cm">Centimeters</option>
  </select>

  <div id="heightFeetInches" class="unit-group">
    <label>Feet:</label>
    <input type="number" id="heightFeet" />
    <label>Inches:</label>
    <input type="number" id="heightInches" />
  </div>

  <div id="heightCm" class="unit-group">
    <label>Height (cm):</label>
    <input type="number" id="heightCentimeters" />
  </div>

  <label for="weightUnit">Weight Unit ⚖️</label>
  <select id="weightUnit" onchange="toggleWeightUnit()">
    <option value="lbs">Pounds (lbs)</option>
    <option value="kg">Kilograms (kg)</option>
  </select>

  <div id="weightLbs" class="unit-group">
    <label>Weight (lbs):</label>
    <input type="number" id="weightPounds" />
  </div>

  <div id="weightKg" class="unit-group">
    <label>Weight (kg):</label>
    <input type="number" id="weightKilograms" />
  </div>

  <label for="activity">Activity Level ⚡</label>
  <select id="activity">
    <option value="1.2">Sedentary</option>
    <option value="1.375">Lightly Active</option>
    <option value="1.55">Moderately Active</option>
    <option value="1.725">Very Active</option>
    <option value="1.9">Super Active</option>
  </select>

  
    <label for="goal">Goal 🎯</label>
    <select id="goal">
      <option value="cut">Lose Fat</option>
      <option value="maintain">Maintain</option>
      <option value="bulk">Build Muscle</option>
    </select>

    <button onclick="calculateMacros()">Calculate</button>
    

  
    <div id="results"></div>

    <div id="cheatSheet" style="margin-top: 30px; background-color: #fff0f5; padding: 15px; border-radius: 10px;">
      <h3>Macro Cheat Sheet 💡</h3>
      <table style="width: 100%; border-collapse: collapse;">
        <tr style="background-color: #f8c8dc;">
          <th style="padding: 8px; border: 1px solid #ccc;">Goal</th>
          <th style="padding: 8px; border: 1px solid #ccc;">Protein (g/lb)</th>
          <th style="padding: 8px; border: 1px solid #ccc;">Carbs (g/lb)</th>
          <th style="padding: 8px; border: 1px solid #ccc;">Fats (g/lb)</th>
          <th style="padding: 8px; border: 1px solid #ccc;">Tips</th>
        </tr>
        <tr>
          <td style="padding: 8px; border: 1px solid #ccc;">Cut</td>
          <td style="padding: 8px; border: 1px solid #ccc;">1.0–1.2</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.8–1.0</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.3–0.4</td>
          <td style="padding: 8px; border: 1px solid #ccc;">Focus on protein, lower carbs</td>
        </tr>
        <tr>
          <td style="padding: 8px; border: 1px solid #ccc;">Maintain</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.8–1.0</td>
          <td style="padding: 8px; border: 1px solid #ccc;">1.0–1.5</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.4–0.5</td>
          <td style="padding: 8px; border: 1px solid #ccc;">Balance intake evenly</td>
        </tr>
        <tr>
          <td style="padding: 8px; border: 1px solid #ccc;">Bulk</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.8–1.0</td>
          <td style="padding: 8px; border: 1px solid #ccc;">2.0–2.5</td>
          <td style="padding: 8px; border: 1px solid #ccc;">0.5–0.6</td>
          <td style="padding: 8px; border: 1px solid #ccc;">Carbs fuel growth</td>
        </tr>
      </table>
    </div>
    

  <script>
    function toggleHeightUnit() {
      const unit = document.getElementById('heightUnit').value;
      document.getElementById('heightFeetInches').style.display = unit === 'feet' ? 'block' : 'none';
      document.getElementById('heightCm').style.display = unit === 'cm' ? 'block' : 'none';
    }

    function toggleWeightUnit() {
      const unit = document.getElementById('weightUnit').value;
      document.getElementById('weightLbs').style.display = unit === 'lbs' ? 'block' : 'none';
      document.getElementById('weightKg').style.display = unit === 'kg' ? 'block' : 'none';
    }

    function calculateMacros() {
      const age = parseInt(document.getElementById('age').value);
      const gender = document.getElementById('gender').value;
      const activity = parseFloat(document.getElementById('activity').value);

      // Height logic
      let heightCm = 0;
      if (document.getElementById('heightUnit').value === 'feet') {
        const feet = parseInt(document.getElementById('heightFeet').value);
        const inches = parseInt(document.getElementById('heightInches').value);
        heightCm = (feet * 12 + inches) * 2.54;
      } else {
        heightCm = parseFloat(document.getElementById('heightCentimeters').value);
      }

      // Weight logic
      let weightKg = 0;
      if (document.getElementById('weightUnit').value === 'lbs') {
        const lbs = parseFloat(document.getElementById('weightPounds').value);
        weightKg = lbs / 2.205;
      } else {
        weightKg = parseFloat(document.getElementById('weightKilograms').value);
      }

      // BMR calculation (Mifflin-St Jeor)
      let bmr = gender === 'male'
        ? 10 * weightKg + 6.25 * heightCm - 5 * age + 5
        : 10 * weightKg + 6.25 * heightCm - 5 * age - 161;

      
    const goal = document.getElementById('goal').value;
    let tdee = bmr * activity;
    if (goal === 'cut') tdee -= 500;
    else if (goal === 'bulk') tdee += 250;
    
      const protein = weightKg * 2.2;
      const fat = (tdee * 0.25) / 9;
      const carbs = (tdee - (protein * 4 + fat * 9)) / 4;

      document.getElementById('results').innerHTML = `
        <h3>Results:</h3>
        <p><strong>Calories:</strong> ${Math.round(tdee)} kcal</p>
        <p><strong>Protein:</strong> ${Math.round(protein)} g</p>
        <p><strong>Fats:</strong> ${Math.round(fat)} g</p>
        <p><strong>Carbs:</strong> ${Math.round(carbs)} g</p>
      `;
    }

    // Default display for unit groups
    toggleHeightUnit();
    toggleWeightUnit();
  </script>
</body>
</html>
