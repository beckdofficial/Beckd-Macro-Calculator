
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beckd Macro Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQE...");
      background-size: cover;
      background-position: center;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 15px;
    }
    h1 {
      color: #d63384;
      text-align: center;
      font-weight: bold;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Beckd Macro Calculator✨</h1>
    <label>Age ✨</label>
    <input type="number" />
    <label>Gender ♀️♂️</label>
    <select><option>Female</option><option>Male</option></select>
    <label>Height Unit ✏️</label>
    <select><option>Feet & Inches</option></select>
    <label>Feet:</label>
    <input type="number" />
    <label>Inches:</label>
    <input type="number" />
    <label>Weight Unit ⚖️</label>
    <select><option>Pounds (lbs)</option></select>
    <label>Weight (lbs):</label>
    <input type="number" />
  </div>
</body>
</html>
