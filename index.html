<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beckd Macro Calculator</title>
  <style>
    body {
      background-color: #fff5f8;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      max-width: 500px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    h1 {
      text-align: center;
      color: #e87ca0;
    }
    label {
      display: block;
      margin: 1rem 0 0.3rem;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }
    button {
      background-color: #e87ca0;
      color: white;
      padding: 0.7rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      width: 100%;
      margin-top: 1.5rem;
    }
    .results {
      margin-top: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .results p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <h1>Beckd Macro Calculator ✨</h1>

  <label for="age">Age ✨</label>
  <input type="number" id="age" />

  <label for="gender">Gender ♀️♂️</label>
  <select id="gender">
    <option value="F">Female</option>
    <option value="M">Male</option>
  </select>

  <label for="height">Height (cm) 📏</label>
  <input type="number" id="height" />

  <label for="weight">Weight (kg) ⚖️</label>
  <input type="number" id="weight" />

  <label for="activity">Activity Level ⚡</label>
  <select id="activity">
    <option value="1.2">Sedentary</option>
    <option value="1.375">Lightly Active</option>
    <option value="1.55">Moderately Active</option>
    <option value="1.725">Very Active</option>
    <option value="1.9">Super Active</option>
  </select>

  <label for="goal">Goal 🎯</label>
  <select id="goal">
    <option value="cut">Cut</option>
    <option value="maintain">Maintain</option>
    <option value="bulk">Bulk</option>
  </select>

  <button onclick="calculateMacros()">Calculate</button>

  <div class="results" id="results" style="display:none">
    <h2>Results:</h2>
    <p id="calories"></p>
    <p id="protein"></p>
    <p id="fat"></p>
    <p id="carbs"></p>
  </div>

  <script>
    function calculateMacros() {
      const age = parseInt(document.getElementById('age').value);
      const gender = document.getElementById('gender').value;
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const activity = parseFloat(document.getElementById('activity').value);
      const goal = document.getElementById('goal').value;

      const bmr = gender === 'M'
        ? 10 * weight + 6.25 * height - 5 * age + 5
        : 10 * weight + 6.25 * height - 5 * age - 161;

      const tdee = bmr * activity;
      const calorieGoal = goal === 'cut' ? tdee - 500 : goal === 'bulk' ? tdee + 250 : tdee;
      const protein = weight * 2.2;
      const fat = (calorieGoal * 0.25) / 9;
      const carbs = (calorieGoal - (protein * 4 + fat * 9)) / 4;

      document.getElementById('results').style.display = 'block';
      document.getElementById('calories').textContent = `Calorie Goal 🔥: ${calorieGoal.toFixed(0)} kcal`;
      document.getElementById('protein').textContent = `Protein 💪: ${protein.toFixed(0)}g`;
      document.getElementById('fat').textContent = `Fat 🥑: ${fat.toFixed(0)}g`;
      document.getElementById('carbs').textContent = `Carbs 🍞: ${carbs.toFixed(0)}g`;
    }
  </script>
</body>
</html>
